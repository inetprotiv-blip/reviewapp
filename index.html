<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Review App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- HTML2Canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #10b981;
            --border-color: #334155;
            --score-color: #10b981;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 80px;
        }

        .screen {
            display: none;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .screen.active { display: block; }

        .search-container {
            position: relative;
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-top: 6px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .search-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }

        .search-poster {
            width: 38px;
            height: 54px;
            object-fit: cover;
            border-radius: 6px;
        }

        .selected-media-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .selected-poster {
            width: 50px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
        }

        .score-header {
            position: sticky;
            top: 0;
            background: var(--bg-color);
            padding: 12px 0;
            z-index: 90;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .score-circle-container {
            position: relative;
            width: 75px;
            height: 75px;
        }

        .score-circle-svg {
            transform: rotate(-90deg);
            width: 75px;
            height: 75px;
        }

        .score-circle-bg {
            fill: none;
            stroke: var(--border-color);
            stroke-width: 6;
        }

        .score-circle-val {
            fill: none;
            stroke: var(--score-color);
            stroke-width: 6;
            stroke-dasharray: 220;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.3s ease;
        }

        .score-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            font-weight: 800;
        }

        .category-card {
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .category-header {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 600;
        }

        .category-body {
            display: none;
            padding: 0 16px 16px 16px;
            border-top: 1px solid var(--border-color);
        }

        .category-card.open .category-body { display: block; }

        .criterion-item { margin-top: 12px; }

        .criterion-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .criterion-name { color: var(--text-muted); }
        .criterion-value { font-weight: 700; }

        .slider {
            width: 100%;
            height: 6px;
            accent-color: var(--accent-color);
        }

        .toggle-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-share { background: #3b82f6; margin-top: 8px; }
        .btn-file { background: #6366f1; margin-top: 8px; }
        .btn-copy { background: #8b5cf6; margin-top: 8px; }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 200;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .nav-item.active { color: var(--accent-color); }

        /* Профиль карточки */
        .profile-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .profile-poster { width: 50px; height: 75px; object-fit: cover; border-radius: 8px; }
        .profile-info { flex: 1; }
        .profile-actions { display: flex; gap: 8px; }
        .btn-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; }

        /* Открытка экспорта */
        #exportCard {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 450px;
            background: #0f172a;
            color: #fff;
            padding: 24px;
            border-radius: 16px;
        }
        .exp-header { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; }
        .exp-poster { width: 90px; height: 130px; border-radius: 8px; object-fit: cover; }
        .exp-title { font-size: 1.4rem; font-weight: 800; }
        .exp-score-box { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 14px; border-radius: 12px; margin-bottom: 14px; }
        .exp-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.9rem; }

        /* Модальное окно просмотра картинки */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 300;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal img { max-width: 100%; max-height: 80vh; border-radius: 12px; }
    </style>
</head>
<body>

    <div id="screen-rate" class="screen active">
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Поиск фильма, сериала или аниме..." autocomplete="off">
            <div id="searchResults" class="search-results"></div>
        </div>

        <div id="selectedMedia" class="selected-media-card" style="display: none;">
            <img id="selectedPoster" class="selected-poster" src="" alt="">
            <div>
                <div id="selectedTitle" style="font-weight: 700;"></div>
                <div id="selectedMeta" style="font-size: 0.8rem; color: var(--text-muted);"></div>
            </div>
        </div>

        <div class="score-header">
            <div>
                <h2 style="font-size: 1.1rem;">Итоговая оценка</h2>
                <span id="scoreStatus" style="font-size: 0.85rem; color: var(--text-muted);">Заполните критерии</span>
            </div>
            <div class="score-circle-container">
                <svg class="score-circle-svg" viewBox="0 0 80 80">
                    <circle class="score-circle-bg" cx="40" cy="40" r="35"></circle>
                    <circle id="scoreCircle" class="score-circle-val" cx="40" cy="40" r="35"></circle>
                </svg>
                <div id="finalScore" class="score-text">0.0</div>
            </div>
        </div>

        <div class="toggle-box">
            <input type="checkbox" id="antagonistToggle" onchange="toggleAntagonist(this.checked)">
            <label for="antagonistToggle" style="font-weight: 600; cursor: pointer;">🦹 Включить блок Антагониста</label>
        </div>

        <div id="categoriesContainer"></div>

        <button id="saveBtn" class="btn">Сохранить оценку</button>
        <button id="shareBtn" class="btn btn-share" style="display: none;">Поделиться картинкой</button>
        <button id="exportTxtBtn" class="btn btn-file" style="display: none;">Скачать подробный документ (.txt)</button>
        <button id="copyTxtBtn" class="btn btn-copy" style="display: none;">📋 Скопировать разбор в буфер</button>
    </div>

    <div id="screen-profile" class="screen">
        <h2 style="margin-bottom: 16px;">Мои оценки</h2>
        <div id="ratingsList"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchScreen('rate')">
            <i data-lucide="star"></i>
            <span>Оценить</span>
        </div>
        <div class="nav-item" onclick="switchScreen('profile')">
            <i data-lucide="user"></i>
            <span>Профиль</span>
        </div>
    </div>

    <!-- Шаблон генерации картинки -->
    <div id="exportCard">
        <div class="exp-header">
            <img id="expPoster" class="exp-poster" src="" alt="">
            <div>
                <div id="expTitle" class="exp-title">Название</div>
                <div id="expMeta" style="color: #94a3b8; font-size: 0.85rem;">Год</div>
            </div>
        </div>
        <div class="exp-score-box">
            <span style="font-weight: 700;">Рейтинг</span>
            <span id="expScore" style="font-size: 1.8rem; font-weight: 900; color: #10b981;">0.0</span>
        </div>
        <div id="expGroups"></div>
    </div>

    <!-- Модалка сгенерированной картинки -->
    <div id="imageModal" class="modal" onclick="this.style.display='none'">
        <img id="modalImg" src="" alt="Нажмите и удерживайте для сохранения">
    </div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const TMDB_API_KEY = '4c0f4fc1132924a214bf425564d0aedf';

    const baseAntagonistCriteria = [
        "Введение (Introduction)", "Философия и Идеология", "Психология и Сложность", "Глубина (Depth)", 
        "Мотивация", "Предыстория (Backstory)", "Внутренний конфликт", "Внешний конфликт", 
        "Главная динамика (с Протагонистом)", "Символизм", "Параллели", "Диалоги", "Монологи", 
        "Цитаты / Реплики", "Количество пиков", "Высший пик", "Количество арок", "Лучшая арка", 
        "Путь / Испытания", "Развитие (Character Arc)", "Катарсис", "Финал / Завершение", "Харизма и Присутствие"
    ];

    const baseProtagonistCriteria = [
        ...baseAntagonistCriteria,
        "Сторонние динамики (Side Dynamics)", "Субъектность (Agency)"
    ];

    const fullCategories = [
        { id: 'protagonist', name: '🦸 Протагонист', weight: 0.25, items: baseProtagonistCriteria },
        { id: 'antagonist', name: '🦹 Антагонист', weight: 0.20, items: baseAntagonistCriteria, isOptional: true },
        { id: 'cast', name: '👥 Каст и Динамики', weight: 0.15, items: ['Дейтрагонист', 'Тритагонист', 'Сайд-каст', 'Внутренние динамики'] },
        { id: 'script', name: '📖 Сценарий и Глубина', weight: 0.25, items: ['Динамичность', 'Философия', 'Психология', 'Символизм', 'Параллели', 'Логика / Лор', 'Пики', 'Высший пик', 'Лучшая арка / сезон', 'Финал'] },
        { id: 'production', name: '🎬 Продакшен и Звук', weight: 0.15, items: ['Актеры / Сейю', 'Операторка / Рисовка', 'Режиссура', 'Саундтрек'] }
    ];

    let currentScores = {};
    let includeAntagonist = false;
    let selectedMediaData = null;
    let editingId = null;

    function renderForm() {
        const container = document.getElementById('categoriesContainer');
        container.innerHTML = '';

        fullCategories.forEach(cat => {
            if (cat.isOptional && !includeAntagonist) return;

            const card = document.createElement('div');
            card.className = 'category-card';
            
            let itemsHTML = '';
            cat.items.forEach((itemName, idx) => {
                const itemId = `${cat.id}_${idx}`;
                if (currentScores[itemId] === undefined) currentScores[itemId] = 5.0;
                
                itemsHTML += `
                    <div class="criterion-item">
                        <div class="criterion-info">
                            <span class="criterion-name">${itemName}</span>
                            <span class="criterion-value" id="val_${itemId}">${Number(currentScores[itemId]).toFixed(1)}</span>
                        </div>
                        <input type="range" class="slider" min="0" max="10" step="0.1" value="${currentScores[itemId]}" 
                               oninput="updateScore('${itemId}', this.value)">
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="category-header" onclick="this.parentElement.classList.toggle('open')">
                    <span>${cat.name}</span>
                    <span id="avg_${cat.id}" style="color: var(--accent-color)">5.0</span>
                </div>
                <div class="category-body">${itemsHTML}</div>
            `;
            container.appendChild(card);
        });
        calculateTotal();
    }

    function toggleAntagonist(checked) {
        includeAntagonist = checked;
        renderForm();
    }

    function updateScore(id, val) {
        const numVal = parseFloat(val);
        currentScores[id] = numVal;
        document.getElementById(`val_${id}`).innerText = numVal.toFixed(1);
        calculateTotal();
    }

    function calculateTotal() {
        let totalWeightedScore = 0;
        let activeCategories = fullCategories.filter(c => !c.isOptional || includeAntagonist);
        let totalWeightSum = activeCategories.reduce((acc, c) => acc + c.weight, 0);

        activeCategories.forEach(cat => {
            let catSum = 0;
            cat.items.forEach((_, idx) => {
                catSum += (currentScores[`${cat.id}_${idx}`] !== undefined ? currentScores[`${cat.id}_${idx}`] : 5.0);
            });
            let catAvg = catSum / cat.items.length;
            const avgElem = document.getElementById(`avg_${cat.id}`);
            if (avgElem) avgElem.innerText = catAvg.toFixed(1);
            
            let normalizedWeight = cat.weight / totalWeightSum;
            totalWeightedScore += catAvg * normalizedWeight;
        });

        const finalVal = totalWeightedScore.toFixed(1);
        document.getElementById('finalScore').innerText = finalVal;

        const circle = document.getElementById('scoreCircle');
        const strokeDashoffset = 220 - (220 * (totalWeightedScore / 10));
        circle.style.strokeDashoffset = strokeDashoffset;
    }

    // TMDB Поиск
    let searchTimeout = null;
    document.getElementById('searchInput').addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        const query = e.target.value.trim();
        if (query.length < 2) {
            document.getElementById('searchResults').style.display = 'none';
            return;
        }
        searchTimeout = setTimeout(() => searchTMDB(query), 400);
    });

    async function searchTMDB(query) {
        try {
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&language=ru-RU&query=${encodeURIComponent(query)}`);
            const data = await res.json();
            showSearchResults(data.results || []);
        } catch (err) { console.error(err); }
    }

    function showSearchResults(results) {
        const box = document.getElementById('searchResults');
        box.innerHTML = '';
        const filtered = results.filter(r => r.media_type === 'tv' || r.media_type === 'movie');

        filtered.slice(0, 5).forEach(item => {
            const div = document.createElement('div');
            div.className = 'search-item';
            const title = item.title || item.name;
            const year = (item.release_date || item.first_air_date || '').split('-')[0];
            const poster = item.poster_path ? `https://image.tmdb.org/t/p/w92${item.poster_path}` : '';

            div.innerHTML = `
                <img class="search-poster" src="${poster || 'https://via.placeholder.com/38x54'}" alt="">
                <div>
                    <div style="font-weight: 600; font-size: 0.95rem;">${title}</div>
                    <div style="font-size: 0.8rem; color: var(--text-muted);">${year}</div>
                </div>
            `;

            div.onclick = () => {
                selectedMediaData = {
                    title: title,
                    year: year,
                    poster: poster ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : ''
                };
                editingId = null;
                document.getElementById('selectedPoster').src = selectedMediaData.poster;
                document.getElementById('selectedTitle').innerText = title;
                document.getElementById('selectedMeta').innerText = year;
                document.getElementById('selectedMedia').style.display = 'flex';
                box.style.display = 'none';
                document.getElementById('searchInput').value = '';
            };
            box.appendChild(div);
        });
        box.style.display = 'block';
    }

    // Сохранение в Профиль (localStorage)
    document.getElementById('saveBtn').onclick = () => {
        if (!selectedMediaData) {
            alert('Сначала выберите произведение через поиск!');
            return;
        }

        let saved = JSON.parse(localStorage.getItem('my_reviews') || '[]');
        const reviewItem = {
            id: editingId || Date.now(),
            media: selectedMediaData,
            scores: { ...currentScores },
            includeAntagonist: includeAntagonist,
            finalScore: document.getElementById('finalScore').innerText,
            date: new Date().toLocaleDateString('ru-RU')
        };

        if (editingId) {
            saved = saved.map(item => item.id === editingId ? reviewItem : item);
        } else {
            saved.unshift(reviewItem);
        }

        localStorage.setItem('my_reviews', JSON.stringify(saved));
        
        document.getElementById('shareBtn').style.display = 'block';
        document.getElementById('exportTxtBtn').style.display = 'block';
        document.getElementById('copyTxtBtn').style.display = 'block';

        alert('Оценка успешно сохранена в профиль!');
        renderProfile();
    };

    // Отрисовка Профиля
    function renderProfile() {
        const listContainer = document.getElementById('ratingsList');
        const saved = JSON.parse(localStorage.getItem('my_reviews') || '[]');

        if (saved.length === 0) {
            listContainer.innerHTML = '<div style="color: var(--text-muted); text-align: center; margin-top: 40px;">У вас пока нет сохранённых оценок.</div>';
            return;
        }

        listContainer.innerHTML = '';
        saved.forEach(item => {
            const card = document.createElement('div');
            card.className = 'profile-card';
            card.innerHTML = `
                <img class="profile-poster" src="${item.media.poster || 'https://via.placeholder.com/50x75'}" alt="">
                <div class="profile-info">
                    <div style="font-weight: 700; font-size: 1rem;">${item.media.title} (${item.media.year})</div>
                    <div style="font-size: 0.85rem; color: var(--accent-color); font-weight: 700;">Оценка: ${item.finalScore} / 10</div>
                    <div style="font-size: 0.75rem; color: var(--text-muted);">${item.date}</div>
                </div>
                <div class="profile-actions">
                    <button class="btn-icon" onclick="editReview(${item.id})"><i data-lucide="edit-2"></i></button>
                    <button class="btn-icon" style="color: var(--danger-color)" onclick="deleteReview(${item.id})"><i data-lucide="trash-2"></i></button>
                </div>
            `;
            listContainer.appendChild(card);
        });
        lucide.createIcons();
    }

    function editReview(id) {
        const saved = JSON.parse(localStorage.getItem('my_reviews') || '[]');
        const target = saved.find(item => item.id === id);
        if (!target) return;

        selectedMediaData = target.media;
        currentScores = { ...target.scores };
        includeAntagonist = target.includeAntagonist;
        editingId = target.id;

        document.getElementById('selectedPoster').src = selectedMediaData.poster;
        document.getElementById('selectedTitle').innerText = selectedMediaData.title;
        document.getElementById('selectedMeta').innerText = selectedMediaData.year;
        document.getElementById('selectedMedia').style.display = 'flex';
        document.getElementById('antagonistToggle').checked = includeAntagonist;

        document.getElementById('shareBtn').style.display = 'block';
        document.getElementById('exportTxtBtn').style.display = 'block';
        document.getElementById('copyTxtBtn').style.display = 'block';

        renderForm();
        switchScreen('rate');
    }

    function deleteReview(id) {
        if (!confirm('Удалить эту оценку из профиля?')) return;
        let saved = JSON.parse(localStorage.getItem('my_reviews') || '[]');
        saved = saved.filter(item => item.id !== id);
        localStorage.setItem('my_reviews', JSON.stringify(saved));
        renderProfile();
    }

    // Экспорт Картинки
    document.getElementById('shareBtn').onclick = async () => {
        if (!selectedMediaData) return;

        document.getElementById('expPoster').src = selectedMediaData.poster;
        document.getElementById('expTitle').innerText = selectedMediaData.title;
        document.getElementById('expMeta').innerText = selectedMediaData.year;
        document.getElementById('expScore').innerText = document.getElementById('finalScore').innerText;

        let groupsHTML = '';
        fullCategories.forEach(cat => {
            if (cat.isOptional && !includeAntagonist) return;
            const avg = document.getElementById(`avg_${cat.id}`)?.innerText || '0.0';
            groupsHTML += `<div class="exp-row"><span>${cat.name}</span><b>${avg}/10</b></div>`;
        });
        document.getElementById('expGroups').innerHTML = groupsHTML;

        const cardContainer = document.getElementById('exportCard');
        const canvas = await html2canvas(cardContainer, { useCORS: true });
        
        canvas.toBlob(blob => {
            const file = new File([blob], `${selectedMediaData.title}_review.png`, { type: "image/png" });
            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({ files: [file], title: selectedMediaData.title });
            } else {
                const modalImg = document.getElementById('modalImg');
                modalImg.src = canvas.toDataURL();
                document.getElementById('imageModal').style.display = 'flex';
            }
        });
    };

    // Генерация текста
    function generateTxtReport() {
        let content = `=====================================\n`;
        content += `ОБЗОР И ОЦЕНКА: ${selectedMediaData.title} (${selectedMediaData.year})\n`;
        content += `ИТОГОВЫЙ БАЛЛ: ${document.getElementById('finalScore').innerText} / 10\n`;
        content += `=====================================\n\n`;

        fullCategories.forEach(cat => {
            if (cat.isOptional && !includeAntagonist) return;
            const catAvg = document.getElementById(`avg_${cat.id}`)?.innerText || '0.0';
            content += `--- ${cat.name.toUpperCase()} (Средняя: ${catAvg}/10) ---\n`;
            
            cat.items.forEach((itemName, idx) => {
                const itemId = `${cat.id}_${idx}`;
                const val = (currentScores[itemId] !== undefined ? currentScores[itemId] : 5.0).toFixed(1);
                content += `  • ${itemName}: ${val}/10\n`;
            });
            content += `\n`;
        });
        return content;
    }

    // Экспорт `.txt`
    document.getElementById('exportTxtBtn').onclick = () => {
        if (!selectedMediaData) return;
        const text = generateTxtReport();
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${selectedMediaData.title}_разбор.txt`;
        a.click();
    };

    // Копирование разбора в буфер
    document.getElementById('copyTxtBtn').onclick = () => {
        if (!selectedMediaData) return;
        const text = generateTxtReport();
        navigator.clipboard.writeText(text).then(() => {
            alert('Полный текстовый разбор скопирован в буфер обмена!');
        }).catch(() => {
            alert('Ошибка копирования');
        });
    };

    function switchScreen(screen) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        if (screen === 'rate') {
            document.getElementById('screen-rate').classList.add('active');
            document.querySelectorAll('.nav-item')[0].classList.add('active');
        } else {
            document.getElementById('screen-profile').classList.add('active');
            document.querySelectorAll('.nav-item')[1].classList.add('active');
            renderProfile();
        }
    }

    lucide.createIcons();
    renderForm();
    renderProfile();
</script>
</body>
</html>
